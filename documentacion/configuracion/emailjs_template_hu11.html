<!doctype html>
<html lang="es">
<body style="margin:0;background:#f4f7f8;font-family:Arial,sans-serif;color:#235166;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0"
               style="max-width:560px;background:#ffffff;border:1px solid #d8e5e8;">
          <tr>
            <td style="background:#00B3A5;padding:22px;text-align:center;color:#ffffff;">
              <div style="font-size:24px;font-weight:bold;">Carmencita Express</div>
              <div style="font-size:14px;margin-top:4px;">Confirmación de correo electrónico</div>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <p style="font-size:16px;">Hola, <strong>{{nombre}}</strong>:</p>
              <p>Usa el siguiente código para confirmar tu registro:</p>
              <div style="margin:28px 0;text-align:center;">
                <span style="display:inline-block;background:#e5f7f5;color:#235166;
                             border:2px solid #00B3A5;padding:16px 28px;
                             font-size:30px;font-weight:bold;letter-spacing:8px;">
                  {{codigo}}
                </span>
              </div>
              <p>El código es válido durante 10 minutos.</p>
              <p style="font-size:13px;color:#687f89;">
                Si no solicitaste este registro, ignora este mensaje.
              </p>
            </td>
          </tr>
          <tr>
            <td style="background:#235166;padding:16px;text-align:center;color:#ffffff;font-size:12px;">
              Carmencita Express · Conectamos tus envíos
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
